<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AICTE approval and compliance platform — proposed technical workflow</title>
  <desc id="desc">A 16 by 9 architecture diagram showing users, React frontend, JWT and role based access, FastAPI workflow services, PostgreSQL, secure document storage, and asynchronous deadline alerts using Celery and Redis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8fc"/><stop offset="1" stop-color="#eaf0f8"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123b67"/><stop offset="1" stop-color="#0b2442"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6a623"/><stop offset="1" stop-color="#e77616"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16324f" flood-opacity=".12"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#456b92"/></marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#e8871b"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#18324f}.title{font-size:42px;font-weight:750;letter-spacing:-.6px}.sub{font-size:19px;fill:#5c7187}.cardTitle{font-size:23px;font-weight:700}.cardSub{font-size:15px;font-weight:700;letter-spacing:1.1px;fill:#73879b}.body{font-size:17px;fill:#3e566f}.small{font-size:15px;fill:#60758a}.chip{font-size:14px;font-weight:700}.laneTitle{font-size:20px;font-weight:750}.foot{font-size:16px;fill:#e8eef6}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1920" height="12" fill="url(#orange)"/>

  <g transform="translate(78 58)">
    <circle cx="24" cy="23" r="23" fill="url(#orange)"/>
    <text x="24" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">AI</text>
    <text x="64" y="20" class="title">Approval &amp; compliance workflow</text>
    <text x="65" y="53" class="sub">Proposed implementation architecture · configurable rules · human-led regulatory decisions</text>
  </g>
  <rect x="1510" y="59" width="330" height="42" rx="21" fill="#fff3df" stroke="#f2d3a3"/>
  <text x="1675" y="86" text-anchor="middle" class="chip" fill="#9c5b06">SIH TECHNICAL APPROACH</text>

  <!-- Main synchronous path -->
  <text x="78" y="163" class="cardSub">REQUEST &amp; CASE PROCESSING · SYNCHRONOUS API FLOW</text>

  <!-- Users -->
  <g filter="url(#shadow)"><rect x="78" y="204" width="220" height="340" rx="22" fill="#fff" stroke="#d9e2ec"/></g>
  <circle cx="188" cy="250" r="28" fill="#eaf1f8"/>
  <path d="M188 235a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-18 37c2-10 9-15 18-15s16 5 18 15" fill="none" stroke="#315c83" stroke-width="4" stroke-linecap="round"/>
  <text x="188" y="308" text-anchor="middle" class="cardTitle">People</text>
  <text x="188" y="335" text-anchor="middle" class="cardSub">ROLE-BASED USERS</text>
  <line x1="108" y1="356" x2="268" y2="356" stroke="#e5ebf1"/>
  <text x="108" y="390" class="body">Institution applicant</text>
  <text x="108" y="424" class="body">Regional officer</text>
  <text x="108" y="458" class="body">Scrutiny / EVC / SAC</text>
  <text x="108" y="492" class="body">Bureau / EC / Council</text>

  <!-- React -->
  <g filter="url(#shadow)"><rect x="350" y="204" width="270" height="340" rx="22" fill="#fff" stroke="#d9e2ec"/></g>
  <rect x="350" y="204" width="270" height="9" rx="5" fill="#36a6b8"/>
  <circle cx="485" cy="255" r="29" fill="#e7f7f8"/>
  <text x="485" y="263" text-anchor="middle" font-size="22" font-weight="800" fill="#188395">UI</text>
  <text x="485" y="310" text-anchor="middle" class="cardTitle">React web app</text>
  <text x="485" y="338" text-anchor="middle" class="cardSub">USER EXPERIENCE</text>
  <line x1="382" y1="358" x2="588" y2="358" stroke="#e5ebf1"/>
  <text x="382" y="393" class="body">Role-based dashboards</text>
  <text x="382" y="427" class="body">Applications &amp; case actions</text>
  <text x="382" y="461" class="body">EVC, compliance &amp; reports</text>
  <text x="382" y="495" class="body">Secure document upload</text>

  <!-- Auth -->
  <g filter="url(#shadow)"><rect x="674" y="204" width="230" height="340" rx="22" fill="#fff" stroke="#f0d7b4"/></g>
  <rect x="674" y="204" width="230" height="9" rx="5" fill="url(#orange)"/>
  <circle cx="789" cy="255" r="29" fill="#fff2df"/>
  <path d="M789 237 804 243v11c0 11-8 18-15 22-7-4-15-11-15-22v-11Z" fill="none" stroke="#c57213" stroke-width="3" stroke-linejoin="round"/>
  <path d="m782 255 5 5 10-11" fill="none" stroke="#c57213" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="789" y="310" text-anchor="middle" class="cardTitle">JWT + RBAC</text>
  <text x="789" y="338" text-anchor="middle" class="cardSub">IDENTITY &amp; ACCESS</text>
  <line x1="704" y1="358" x2="874" y2="358" stroke="#e5ebf1"/>
  <text x="704" y="394" class="body">Token validation</text>
  <text x="704" y="428" class="body">Role / permission checks</text>
  <text x="704" y="462" class="body">API access per action</text>
  <text x="704" y="505" class="small">Identity provider can be integrated</text>

  <!-- API -->
  <g filter="url(#shadow)"><rect x="958" y="204" width="430" height="340" rx="22" fill="url(#navy)"/></g>
  <rect x="958" y="204" width="430" height="9" rx="5" fill="url(#orange)"/>
  <text x="1000" y="254" class="cardTitle" fill="#fff">FastAPI services</text>
  <text x="1000" y="282" class="cardSub" fill="#a9c1d9">VALIDATED API + WORKFLOW RULES</text>
  <rect x="1000" y="305" width="170" height="41" rx="10" fill="#234a70"/><text x="1085" y="331" text-anchor="middle" class="chip" fill="#f0f6fc">Applications</text>
  <rect x="1180" y="305" width="166" height="41" rx="10" fill="#234a70"/><text x="1263" y="331" text-anchor="middle" class="chip" fill="#f0f6fc">Workflow / APH</text>
  <rect x="1000" y="357" width="170" height="41" rx="10" fill="#234a70"/><text x="1085" y="383" text-anchor="middle" class="chip" fill="#f0f6fc">EVC scheduling</text>
  <rect x="1180" y="357" width="166" height="41" rx="10" fill="#234a70"/><text x="1263" y="383" text-anchor="middle" class="chip" fill="#f0f6fc">Compliance</text>
  <rect x="1000" y="409" width="170" height="41" rx="10" fill="#234a70"/><text x="1085" y="435" text-anchor="middle" class="chip" fill="#f0f6fc">Alerts &amp; audit</text>
  <rect x="1180" y="409" width="166" height="41" rx="10" fill="#234a70"/><text x="1263" y="435" text-anchor="middle" class="chip" fill="#f0f6fc">Reports</text>
  <text x="1000" y="489" class="small" fill="#c2d2e1">Human review and approval remain in the workflow.</text>

  <!-- Database -->
  <g filter="url(#shadow)"><rect x="1440" y="204" width="250" height="340" rx="22" fill="#fff" stroke="#d9e2ec"/></g>
  <rect x="1440" y="204" width="250" height="9" rx="5" fill="#367a58"/>
  <ellipse cx="1565" cy="245" rx="31" ry="11" fill="#e9f6ed" stroke="#367a58" stroke-width="3"/>
  <path d="M1534 245v34c0 6 14 11 31 11s31-5 31-11v-34M1534 262c0 6 14 11 31 11s31-5 31-11" fill="#e9f6ed" stroke="#367a58" stroke-width="3"/>
  <text x="1565" y="322" text-anchor="middle" class="cardTitle">PostgreSQL</text>
  <text x="1565" y="350" text-anchor="middle" class="cardSub">SOURCE OF RECORD</text>
  <line x1="1470" y1="369" x2="1660" y2="369" stroke="#e5ebf1"/>
  <text x="1470" y="404" class="body">Applications &amp; stages</text>
  <text x="1470" y="438" class="body">Deadlines &amp; submissions</text>
  <text x="1470" y="472" class="body">Users, roles &amp; rules</text>
  <text x="1470" y="506" class="body">Audit &amp; alert history</text>

  <!-- Object storage -->
  <g filter="url(#shadow)"><rect x="1730" y="204" width="140" height="340" rx="22" fill="#fff" stroke="#d9e2ec"/></g>
  <circle cx="1800" cy="255" r="29" fill="#f0eaff"/>
  <path d="M1787 245h22l8 8v18h-30zM1809 245v9h8M1793 261h18M1793 268h18" fill="none" stroke="#7052a3" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="1800" y="310" text-anchor="middle" class="cardTitle" font-size="19">Document</text>
  <text x="1800" y="335" text-anchor="middle" class="cardTitle" font-size="19">storage</text>
  <text x="1800" y="363" text-anchor="middle" class="cardSub">PRIVATE FILES</text>
  <line x1="1750" y1="380" x2="1850" y2="380" stroke="#e5ebf1"/>
  <text x="1800" y="415" text-anchor="middle" class="small">S3 / MinIO</text>
  <text x="1800" y="449" text-anchor="middle" class="small">Encrypted</text>
  <text x="1800" y="483" text-anchor="middle" class="small">DB stores</text>
  <text x="1800" y="505" text-anchor="middle" class="small">metadata</text>

  <!-- Main arrows -->
  <path d="M298 374H337" fill="none" stroke="#456b92" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M620 374H661" fill="none" stroke="#456b92" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M904 374H945" fill="none" stroke="#456b92" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M1388 374H1427" fill="none" stroke="#456b92" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M1388 450H1717" fill="none" stroke="#7052a3" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/>
  <rect x="1480" y="426" width="167" height="31" rx="15" fill="#f4efff"/><text x="1564" y="447" text-anchor="middle" class="chip" fill="#7052a3">signed upload link</text>
  <rect x="625" y="302" width="50" height="30" rx="15" fill="#fff3df"/><text x="650" y="322" text-anchor="middle" class="chip" fill="#9c5b06">JWT</text>
  <rect x="911" y="302" width="78" height="30" rx="15" fill="#edf3f8"/><text x="950" y="322" text-anchor="middle" class="chip" fill="#315c83">HTTPS</text>

  <!-- Async lane -->
  <rect x="78" y="606" width="1792" height="290" rx="26" fill="#fff" stroke="#d7e0e9" filter="url(#shadow)"/>
  <rect x="78" y="606" width="1792" height="7" rx="4" fill="url(#orange)"/>
  <text x="112" y="652" class="laneTitle">Deadline &amp; notification automation</text>
  <text x="112" y="679" class="small">Runs independently of a user request; retries and records delivery outcomes.</text>

  <!-- beat -->
  <rect x="112" y="716" width="285" height="128" rx="17" fill="#fff8eb" stroke="#efcf9e" stroke-width="2"/>
  <circle cx="153" cy="758" r="22" fill="#ffe7c2"/>
  <path d="M153 744v15l10 6" fill="none" stroke="#bd7318" stroke-width="3" stroke-linecap="round"/>
  <text x="190" y="754" class="cardTitle" font-size="21">Celery Beat</text>
  <text x="137" y="795" class="body">Schedules daily deadline checks</text>
  <text x="137" y="821" class="small">and reminder runs</text>

  <!-- Redis -->
  <rect x="484" y="716" width="255" height="128" rx="17" fill="#fff1f0" stroke="#f0c1bd" stroke-width="2"/>
  <circle cx="526" cy="758" r="22" fill="#ffe0de"/>
  <path d="m514 752 12-6 12 6-12 6zm0 8 12 6 12-6m-24 8 12 6 12-6" fill="none" stroke="#b63c33" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="562" y="754" class="cardTitle" font-size="21">Redis queue</text>
  <text x="509" y="795" class="body">Short-lived job broker</text>
  <text x="509" y="821" class="small">tasks · retries · queue state</text>

  <!-- Celery worker -->
  <rect x="826" y="716" width="350" height="128" rx="17" fill="#eff7ff" stroke="#bdd5ea" stroke-width="2"/>
  <circle cx="869" cy="758" r="22" fill="#dcecff"/>
  <path d="M857 751h24v17h-24zm5-5v5m14-5v5m-14 22v-5m14 5v-5" fill="none" stroke="#315c83" stroke-width="2.5" stroke-linecap="round"/>
  <text x="906" y="754" class="cardTitle" font-size="21">Celery workers</text>
  <text x="851" y="795" class="body">Check due dates &amp; escalation rules</text>
  <text x="851" y="821" class="small">create alerts · retry failed sends</text>

  <!-- channels -->
  <rect x="1263" y="716" width="260" height="128" rx="17" fill="#f1f8f2" stroke="#c7dfcb" stroke-width="2"/>
  <circle cx="1306" cy="758" r="22" fill="#ddf0e0"/>
  <path d="M1295 751h22v15h-22zm0 1 11 8 11-8" fill="none" stroke="#367a58" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="1343" y="754" class="cardTitle" font-size="21">Notify users</text>
  <text x="1288" y="795" class="body">In-app · email · SMS*</text>
  <text x="1288" y="821" class="small">according to role &amp; policy</text>

  <!-- persist results -->
  <rect x="1600" y="716" width="230" height="128" rx="17" fill="#edf7f0" stroke="#bfd7c5" stroke-width="2"/>
  <text x="1715" y="754" text-anchor="middle" class="cardTitle" font-size="21">Persist outcome</text>
  <text x="1715" y="795" text-anchor="middle" class="body">Alert + audit event</text>
  <text x="1715" y="821" text-anchor="middle" class="small">written to PostgreSQL</text>

  <!-- async arrows -->
  <path d="M397 780H471" fill="none" stroke="#e8871b" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M739 780H813" fill="none" stroke="#e8871b" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M1176 780H1250" fill="none" stroke="#e8871b" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M1523 780H1587" fill="none" stroke="#e8871b" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M1180 858C1300 889 1510 891 1632 858" fill="none" stroke="#367a58" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/>
  <text x="1402" y="884" text-anchor="middle" class="small">Database read/write</text>
  <rect x="303" y="858" width="670" height="25" rx="12" fill="#f4f7fa"/>
  <text x="638" y="876" text-anchor="middle" class="small">FastAPI enqueues jobs after saving a case change; Beat also starts scheduled checks.</text>

  <!-- footer -->
  <rect x="78" y="934" width="1792" height="82" rx="19" fill="url(#navy)"/>
  <circle cx="119" cy="975" r="18" fill="#f5a623"/>
  <path d="m111 975 6 6 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="153" y="970" class="foot" font-weight="700">Security &amp; accountability</text>
  <text x="153" y="994" class="foot">TLS in transit · encrypted document storage · role-based access · append-only audit trail · human approval</text>
  <text x="1817" y="985" text-anchor="end" font-size="14" fill="#b9c9d9">*SMS/email providers and AICTE system links depend on authorised integrations.</text>
</svg>
